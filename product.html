<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LXPoint · Product Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta name="theme-color" content="#ff4d00">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --red:#ff4747;
      --orange:#ff6a00;
      --orange-soft:#fff3e8;
      --text:#222;
      --muted:#666;
      --subtle:#999;
      --line:#eee;
      --bg:#fbfbfb;
      --card:#fff;
      --green:#16a05d;
      --container:1280px;
    }
    html{scroll-behavior:smooth}
    body{
      font-family:Inter,Arial,sans-serif;
      color:var(--text);
      background:var(--bg);
      -webkit-font-smoothing:antialiased;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
     .container{
  width:min(var(--container),calc(100% - 32px));
  margin:0 auto;
  padding:18px 0 70px;
  padding-top:92px;
}

@media(max-width:760px){
  .container{
    width:100%;
    padding:0 0 75px;
    padding-top: 72px; /* fixed mobile header (62px) + 10px gap */
  }
}
    .product-layout{align-items:stretch}
    .image-gallery{
      background:#fff;
      padding:16px;
      border-radius:2px;
      min-width:0;
      min-height:0;
      height:100%;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .gallery-scroll{
      min-height:0;
      flex:1 1 auto;
      overflow-y:auto;
      overflow-x:hidden;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }
    .gallery-scroll::-webkit-scrollbar{width:0;height:0}
    .desc-images-section{
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid #f0f0f0;
    }
    .desc-images-grid{
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      gap:8px;
    }
    .desc-image-item{
      position:relative;
      aspect-ratio:1/1;
      min-width:0;
      background:#f7f7f7;
      border:1px solid #e8e8e8;
      border-radius:3px;
      overflow:hidden;
      cursor:pointer;
      transition:border-color .15s ease,transform .15s ease;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .desc-image-item.active{border:2px solid #111}
    .desc-image-item:hover{border-color:#999;transform:scale(1.02)}
    .desc-image-item img{width:100%;height:100%;object-fit:cover;display:block}
    .more-images-btn{
      width:100%;
      height:100%;
      border:1px dashed #bbb;
      background:#fafafa;
      color:#555;
      font-size:11px;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:4px;
      transition:.15s ease;
    }
    .more-images-btn:hover{background:#f3f3f3;border-color:#888;color:#111}
    .gallery-tabs{margin-top:14px;border-top:1px solid #eee}
    .gallery-tab-bar{
      display:flex;
      border-bottom:1px solid #ddd;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .gallery-tab-bar::-webkit-scrollbar{display:none}
    .gallery-tab{
      flex:0 0 auto;
      padding:12px 14px;
      border:0;
      border-bottom:2px solid transparent;
      background:#fff;
      color:#666;
      font-size:11px;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }
    .gallery-tab.active{color:#111;border-bottom-color:#111}
    .gallery-tab-content{
      padding:12px 2px 18px;
      color:#555;
      font-size:12px;
      line-height:1.65;
    }
    .gallery-tab-panel{display:none}
    .gallery-tab-panel.active{display:block}
    .gallery-tab-panel img.desc-image{
      max-width:100%;
      height:auto;
      border-radius:4px;
      margin:8px 0;
      display:block;
    }
    .review-summary{
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 0 12px;
      border-bottom:1px solid #eee;
    }
    .review-score{font-size:28px;line-height:1;font-weight:800;color:#222}
    .review-stars{color:#ff9800;letter-spacing:1px;font-size:15px}
    .review-count{color:#888;font-size:11px}
    .info-list{display:grid;gap:8px}
    .info-row{display:grid;grid-template-columns:105px 1fr;gap:8px}
    .info-label{color:#999}
    .info-value{color:#333}
    .shipping-selector {
      margin-top: 8px;
      border-top: 1px solid #f0f0f0;
      padding-top: 10px;
    }
    .shipping-option {
      display:flex;
      align-items:center;
      padding:8px 10px;
      margin-bottom:4px;
      border:1px solid #e8e8e8;
      border-radius:4px;
      cursor:pointer;
      transition:all .15s ease;
      background:#fff;
      gap:10px;
    }
    .country-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.3s ease;
      padding: 20px;
    }
    .country-modal.hidden { display: none; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .country-modal-content {
      background: white;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 40px 32px 32px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      text-align: center;
      animation: slideUp 0.35s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .country-modal-header { margin-bottom: 28px; }
    .country-modal-icon { font-size: 48px; display: block; margin-bottom: 12px; }
    .country-modal-header h2 { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
    .country-modal-header p { color: #777; font-size: 14px; }
    .country-modal-options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .country-modal-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border: 2px solid #e8ecf1;
      border-radius: 14px;
      background: rgb(224, 224, 224);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: #1a1a2e;
      width: 100%;
      text-align: center;
      position: relative;
    }
    .country-modal-btn:hover { border-color: #ff6a00; background: #fff8f3; transform: translateY(-2px); }
    .country-modal-btn .flag { font-size: 28px; }
    .country-modal-btn .country-name { flex: 1; }
    .country-modal-btn .country-check { color: #ff6a00; font-weight: 700; font-size: 18px; opacity: 0; transition: opacity 0.2s; }
    .country-modal-btn.selected .country-check { opacity: 1; }
    .country-modal-btn.selected { border-color: #ff6a00; background: #fff3e8; }
    .country-modal-footer { border-top: 1px solid #f0f0f0; padding-top: 16px; }
    .country-modal-note { font-size: 12px; color: #999; }
    @media(max-width:480px) {
      .country-modal-content { padding: 28px 20px 24px; }
      .country-modal-header h2 { font-size: 19px; }
      .country-modal-btn { padding: 14px 16px; font-size: 15px; }
      .country-modal-btn .flag { font-size: 24px; }
    }
    .shipping-option:hover {border-color:#ff6a00;background:#fff8f3}
    .shipping-option.selected {border-color:#ff6a00;background:#fff3e8;border-width:2px}
    .shipping-option input[type="radio"] {flex-shrink:0;width:16px;height:16px;accent-color:#ff6a00;cursor:pointer}
    .shipping-option-details {flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
    .shipping-option-name {font-weight:600;font-size:13px;color:#222}
    .shipping-option-price {font-weight:700;color:#f53d2d;font-size:13px}
    .shipping-option-price-lkr {font-size:11px;color:#999}
    .shipping-option-delivery {font-size:12px;color:#666;background:#f5f5f5;padding:1px 8px;border-radius:10px}
    .shipping-option-free {background:#16a05d;color:#fff;font-size:10px;font-weight:700;padding:1px 8px;border-radius:10px}
    .shipping-option-tag {font-size:10px;color:#999;background:#f0f0f0;padding:1px 6px;border-radius:3px}
    .shipping-selected-summary {margin-top:6px;font-size:11px;color:#999}
    @media(max-width:760px){
      .desc-images-grid{grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:6px}
      .shipping-option{padding:10px 8px}
      .shipping-option-details{gap:4px 8px}
      .shipping-option-name{font-size:12px}
      .shipping-option-price{font-size:12px}
    }
    @media(max-width:480px){.desc-images-grid{grid-template-columns:repeat(auto-fill,minmax(55px,1fr));gap:5px}}
    .back-link{
      display:flex;
      align-items:center;
      gap:7px;
      color:#666;
      font-size:13px;
      margin:0 0 14px;
    }
    .back-link:hover{color:#111}
    .back-link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .product-layout{
      display:grid;
      grid-template-columns:minmax(0,620px) minmax(430px,1fr);
      gap:28px;
      align-items:start;
    }
        .image-gallery{
      background:#fff;
      padding:16px;
      border-radius:2px;
      min-width:0;
    }

    /* On mobile, gallery sits below the fixed header */
    @media(max-width:760px){
      .image-gallery{
        padding:10px;
        padding-top:6px;
      }
      .main-image-wrap{
        margin-top:0;
      }
    }
    .main-image-wrap{
      width:100%;
      aspect-ratio:1/1;
      background:#fff;
      border:1px solid #f0f0f0;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
    }
    .main-image{
      width:100%;
      height:100%;
      object-fit:contain;
      transition:opacity .18s ease,transform .25s ease;
    }
    .main-image-wrap:hover .main-image{transform:scale(1.02)}
    .thumbnails{
      display:flex;
      gap:9px;
      margin-top:12px;
      overflow-x:auto;
      padding-bottom:2px;
    }
    .thumb{
      flex:0 0 68px;
      width:68px;
      height:68px;
      object-fit:cover;
      background:#fff;
      border:1px solid #ddd;
      cursor:pointer;
      transition:border-color .15s,opacity .15s;
    }
    .thumb:hover{border-color:#999}
    .thumb.active{border:2px solid #111;opacity:1}
    .product-info{
      background:#fff;
      min-width:0;
      padding:18px 20px 22px;
    }
    .product-category{
      display:inline-block;
      color:#777;
      font-size:12px;
      margin-bottom:9px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }
    .product-name{
      font-size:22px;
      line-height:1.38;
      font-weight:600;
      color:#222;
      margin-bottom:13px;
    }
    .rating-row{
      display:flex;
      align-items:center;
      gap:13px;
      padding-bottom:14px;
      border-bottom:1px solid #f0f0f0;
      font-size:12px;
    }
    .stars{color:#ff9800;font-size:16px;letter-spacing:1px}
    .rating-link{text-decoration:underline;color:#333}
    .sold{color:#777}
    .price-area{
      background:var(--orange-soft);
      margin:0 -20px 0;
      padding:15px 20px;
    }
    .price-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .product-price{
      color:#f53d2d;
      font-size:34px;
      line-height:1;
      font-weight:800;
    }
    .price-label{font-size:12px;color:#777}
    .old-price{
      color:#999;
      text-decoration:line-through;
      font-size:13px;
    }
    .deal-badge{
      background:#f53d2d;
      color:#fff;
      font-size:10px;
      font-weight:800;
      padding:4px 6px;
      border-radius:2px;
    }
    .detail-meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px 18px;
      padding:12px 0;
      border-bottom:1px solid var(--line);
      font-size:11px;
      color:#777;
    }
    .meta-item strong{color:#333;margin-right:4px}
    .sku-badge{
      display:inline-block;
      background:#f7f7f7;
      padding:2px 5px;
      font-family:monospace;
      font-size:10px;
    }
    .status-approved{color:var(--green);font-weight:700}
    .status-pending{color:#a86d00;font-weight:700}
    .shipping-box{
      padding:14px 0;
      border-bottom:1px solid var(--line);
      font-size:13px;
    }
    .shipping-row{display:grid;grid-template-columns:82px 1fr;gap:10px;margin:7px 0}
    .shipping-label{color:#999}
    .shipping-main{color:#333}
    .shipping-main strong{color:#111}
    .shipping-free{color:var(--green);font-weight:700}
    .shipping-loading{color:#999;font-size:12px;animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .shipping-error{color:#d32f2f;font-size:12px}
    .product-description{
      color:#555;
      font-size:13px;
      line-height:1.65;
      padding:14px 0;
      border-bottom:1px solid var(--line);
      white-space:pre-line;
    }
    .variant-section{
      padding:15px 0 7px;
      border-bottom:1px solid var(--line);
    }
    .variant-heading{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    }
    .variant-heading h4{font-size:14px;font-weight:600}
    .variant-subtitle,.variant-count{font-size:11px;color:#999}
    .variant-grid{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .variant-card{
      position:relative;
      min-width:94px;
      min-height:40px;
      padding:0 12px;
      background:#fff;
      color:#333;
      border:1px solid #bbb;
      border-radius:2px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      transition:border-color .15s,background .15s,color .15s;
    }
    .variant-card:hover:not(.variant-disabled){border-color:#f53d2d}
    .variant-card.selected{
      color:#f53d2d;
      border:2px solid #f53d2d;
      background:#fff8f6;
    }
    .variant-card.variant-disabled{
      opacity:.45;
      cursor:not-allowed;
      background:#f7f7f7;
    }
    .variant-image-wrap{display:none}
    .variant-info{display:block;min-width:0}
    .variant-name-display{
      display:block;
      max-width:180px;
      font-size:12px;
      line-height:1.3;
      white-space:normal;
    }
    .variant-key-display {
      display:block;
      font-size:9px;
      color:#999;
      margin-top:2px;
    }
    .purchase-box{
      margin-top:15px;
      border:0;
      padding:0;
      background:#fff;
      box-shadow:none;
    }
    .purchase-note{
      display:flex;
      align-items:center;
      gap:8px;
      color:#777;
      font-size:11px;
      margin-bottom:11px;
    }
    .purchase-note svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}
    .quantity-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
      font-size:13px;
    }
    .qty-label{color:#555}
    .qty-control{display:flex;border:1px solid #ccc;height:36px}
    .qty-control button{
      width:34px;border:0;background:#fafafa;color:#333;font-size:18px;
    }
    .qty-control input{
      width:45px;text-align:center;border:0;border-left:1px solid #ddd;border-right:1px solid #ddd;outline:0;
    }
    .action-row{
      display:grid;
      grid-template-columns:1fr 1.25fr;
      gap:10px;
    }
    .btn{
      min-height:46px;
      border-radius:2px;
      font-size:14px;
      font-weight:700;
      padding:0 18px;
      transition:.15s ease;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn-secondary{
      background:#fff4ed;
      color:#ff5b00;
      border:1px solid #ff5b00;
    }
    .btn-primary{
      background:linear-gradient(90deg,#ff8a00,#ff4747);
      color:#fff;
      border:1px solid #ff5b00;
    }
    .trust-features{
      display:grid;
      grid-template-columns:repeat(3,1fr);

    }
    .trust-title{display:block;font-size:11px;font-weight:700;color:#333;margin-bottom:3px}
    .trust-text{display:block;font-size:10px;color:#999;line-height:1.4}
    .toast{
      position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);
      background:#222;color:#fff;padding:12px 18px;border-radius:3px;font-size:13px;
      box-shadow:0 8px 30px rgba(0,0,0,.2);opacity:0;visibility:hidden;
      transition:.25s;z-index:1000;max-width:calc(100% - 30px);text-align:center;
    }
    .toast.is-visible{opacity:1;visibility:visible;transform:translate(-50%,0)}

      color:#555;

    .skeleton {
      background: #f0f0f0;
      background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%);
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;

    }

      0% { background-position: -200% 0; }

(function setupHeaderAutoHide() {
    const header = document.querySelector(".header");
    if (!header) return;

    let lastScrollY = window.scrollY;
    let ticking = false;
    const HIDE_THRESHOLD = 80;  // don't hide until scrolled this far
    const DELTA = 6;            // ignore tiny scroll jitters

    function onScroll() {
        const currentY = window.scrollY;
        const diff = currentY - lastScrollY;

        // Near the top → always show
        if (currentY <= HIDE_THRESHOLD) {
            header.classList.remove("header-hidden");
            lastScrollY = currentY;
            return;
        }

        if (Math.abs(diff) < DELTA) return;

        if (diff > 0) {
            // scrolling down → hide
            header.classList.add("header-hidden");
        } else {
            // scrolling up → show
            header.classList.remove("header-hidden");
        }

        lastScrollY = currentY;
        ticking = false;
    }

    window.addEventListener(
        "scroll",
        () => {
            if (!ticking) {
                window.requestAnimationFrame(onScroll);
                ticking = true;
            }
        },
        { passive: true }
    );
})();

  const modal = document.getElementById('countryModal');
  if (modal) modal.classList.add('hidden');

function showToast(message) {

/* =========================================================
   PRICE CALCULATIONS WITH DYNAMIC MARKUP
========================================================= */

function calculateMarkup(priceInLKR) {
    if (priceInLKR < 50000) {
        return priceInLKR * 1.20;
    } else {
        return priceInLKR * 1.10;
    }
}

function priceToLKR(usdPrice) {
    const baseLKR = (usdPrice || 0) * USD_TO_LKR;
    return calculateMarkup(baseLKR);
}

function priceToUSD(usdPrice) {
    const lkr = priceToLKR(usdPrice);
    return lkr / USD_TO_LKR;
}

/* =========================================================
   FORMAT — CURRENCY AWARE
========================================================= */

function formatLKR(value) {
    if (!value || value === 0) return "LKR 0";
    return "LKR " + Math.round(value).toLocaleString("en-LK");
}

function formatUSD(value) {
    if (!value || value === 0) return "$0.00";
    return "$" + Number(value).toFixed(2);
}

// USD price → display string, respects country
function formatPrice(usdPrice) {
    if (useLKR) {
        return formatLKR(priceToLKR(usdPrice));
    }
    return formatUSD(priceToUSD(usdPrice));
}

// Raw USD price → display in local currency (used by shipping, WhatsApp msg)
function formatLocal(usdPrice) {
    if (useLKR) {
        return formatLKR(priceToLKR(usdPrice));
    }
    return formatUSD(priceToUSD(usdPrice));
}

async function loadExchangeRate() {
  try {
    const response = await fetch("https://api.frankfurter.dev/v2/rates?base=USD&quotes=LKR");
    const data = await response.json();
    if (Array.isArray(data) && data.length > 0 && data[0].rate) USD_TO_LKR = data[0].rate;
    else if (data?.rates?.LKR) USD_TO_LKR = data.rates.LKR;
  } catch { console.warn("Exchange rate fallback"); }
}

async function fetchProductDetails(pid) {
  if (!pid) throw new Error("Product ID missing");
  const url = `${SUPABASE_FUNCTION_URL}?action=product&pid=${encodeURIComponent(pid)}`;
  const response = await fetch(url, { method: "GET", headers: { "Content-Type": "application/json" } });
  const data = await response.json();
  if (!response.ok || !data.success) throw new Error(data.error || "Failed to fetch product");
  if (!data.data) throw new Error("No product data returned");
  return data.data;
}

async function fetchShippingRates(vid, quantity, destCountry = DEFAULT_COUNTRY, startCountry = DEFAULT_START_COUNTRY) {
  if (!vid) return null;
  try {
    const url = `${SUPABASE_FUNCTION_URL}?action=shipping&vid=${encodeURIComponent(vid)}&quantity=${quantity || 1}&endCountry=${encodeURIComponent(destCountry)}&startCountry=${encodeURIComponent(startCountry)}`;
    const response = await fetch(url, { method: "GET", headers: { "Content-Type": "application/json" } });
    const data = await response.json();
    if (!response.ok || !data.success) throw new Error(data.error || "Shipping calculation failed");
    return data.data || [];
  } catch (error) {
    console.error("Shipping fetch error:", error);
    return null;
  }
}

  if (details.country) userInfo += `, ${details.country}`;

  if (userInfo) userInfo += '\n';
  
const message = `*I Am Interested in this Product*

*Product:* ${product.name}
*Link:* ${productLink}
*Style/Size:* ${variantName}
*Quantity:* ${qty}
*Price (per unit):* ${formatPrice(price)}
*Subtotal:* ${formatPrice(subTotal)}
*Shipping Method:* ${shipping.logisticName}
*Shipping Price:* ${shippingPrice === 0 ? 'Contact seller' : formatPrice(shippingPrice)}
*Total:* ${formatPrice(total)}
*PID:* ${pid}
*SKU:* ${sku}

*User Details:*
${userInfo || 'Not provided'}

Thank you!`;
  return message;
}

function openWhatsApp() {
  // Require full customer details before Buy Now
  const d = getDetails();
  const hasRequired =
      d.name     && d.name.trim().length >= 2 &&
      d.country  && d.country.trim().length >= 2 &&
      d.city     && d.city.trim().length >= 2 &&
      d.addr1    && d.addr1.trim().length >= 5 &&
      d.postal   && d.postal.trim().length >= 2 &&
      d.contact  && /^[0-9+\-\s]{7,}$/.test(d.contact);

  if (!hasRequired) {
    showToast("Please enter all required details (*)");
    openDetailsModal();
    return;
  }

  const message = generateWhatsAppMessage();
  if (!message) {
    showToast("Product information not ready. Please try again.");
    return;
  }
  const encoded = encodeURIComponent(message);
  const url = `https://wa.me/+94767087651?text=${encoded}`;
  window.open(url, '_blank');
}

function renderProductDetail(product) {
  const container = document.getElementById("productDetail");

  const variants = product.variants || [];

  const parseDescriptionImages = (html) => {
    if (!html) return [];
    const imgRegex = /<img[^>]*src="([^"]*)"[^>]*>/g;

    let match;
    while ((match = imgRegex.exec(html)) !== null) images.push(match[1]);
    return images;
  };
  const descriptionImages = parseDescriptionImages(description);
  const cleanDescription = description ? description
    .replace(/<img[^>]*>/gi, '')
    .replace(/Product\s*Image\s*:?\s*<\/?b>?\s*/gi, '')
    .replace(/<br>\s*>/gi, '\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/&nbsp;/gi, ' ')
    .replace(/\n\s*\n/g, '\n\n')
    .replace(/^\s+|\s+$/g, '')
    .replace(/\n/g, '<br>')
    .replace(/<br>\s*<br>/g, '<br>')
    .trim() : '';
  const allImages = [...new Set([mainImage, ...images, ...descriptionImages].filter(Boolean))];

  const combinedImagesHtml = allImages.length ? `

const oldPriceHtml = suggestPrice && suggestPrice > sellPrice ? `<span class="old-price">${formatPrice(suggestPrice)}</span>` : "";
  const metaHtml = `<div class="detail-meta"><span class="meta-item"><strong>PID:</strong>${pid || "—"}</span><span class="meta-item"><strong>SKU:</strong><span class="sku-badge">${sku || "—"}</span></span><span class="meta-item"><strong>Status:</strong>${statusHtml}</span></div>`;
  const variantCards = variants.slice(0, 30).map((variant) => {

          ${combinedImagesHtml}
          <div class="desktop-gallery-tabs">${galleryTabsHtml}</div>
        </div>
      </div>
      <div class="product-info">
        <span class="product-category">${category}</span>
        <h1 class="product-name">${name}</h1>

        <div class="price-area"><div class="price-line"><span class="product-price">${formatPrice(sellPrice)}</span>${oldPriceHtml}<span class="deal-badge">HOT SALE</span></div><span class="price-label">Price shown before shipping</span></div>
        ${metaHtml}
        <div class="shipping-box">

window._currentProduct = {
    id: pid, name, image: mainImage, price: sellPrice,
    variantId: "", variantName: "", variantKey: "",
    qty: 1, shipping: null,
    rawProduct: product
};
  const firstVariant = document.querySelector(".variant-card:not(.variant-disabled)");

  if (firstVid) updateShippingDisplay(firstVid, 1);

  function addCurrentToCart(showMessage = true) {
    const current = window._currentProduct;
    if (!current) return;
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem("premiumCart") || "[]"); if (!Array.isArray(cart)) cart = []; } catch { cart = []; }
    const existing = cart.find(item => item.id === current.id && item.variantId === current.variantId);
    const productToAdd = { ...current, shipping: window._selectedShipping || null, shippingIndex: window._selectedShippingIndex || 0 };
    if (existing) { existing.qty = (existing.qty || 1) + current.qty; existing.shipping = productToAdd.shipping; existing.shippingIndex = productToAdd.shippingIndex; } else { cart.push(productToAdd); }

window.toggleMoreImages = function(button) {
  const extra = document.getElementById("extraProductImages"), grid = document.getElementById("productImageGrid");
  if (!extra || !grid) return;
  const open = extra.style.display !== "none";
  if (open) { extra.style.display = "none"; button.textContent = `+${extra.querySelectorAll(".desc-image-item").length} More`; grid.scrollIntoView({behavior:"smooth", block:"nearest"}); }
  else { extra.style.display = "grid"; button.textContent = "Show less"; }
  requestAnimationFrame(() => { if (window.syncGalleryHeight) window.syncGalleryHeight(); });
};

window.selectVariant = function(button, imageUrl, vid) {
  const mainImage = document.getElementById("mainImage");
  if (!mainImage || button.classList.contains("variant-disabled")) return;
  mainImage.style.opacity = "0";
  setTimeout(() => { mainImage.src = imageUrl; mainImage.onload = () => mainImage.style.opacity = "1"; }, 100);
  document.querySelectorAll(".variant-card").forEach(c => c.classList.remove("selected"));
  button.classList.add("selected");
  if (window._currentProduct) {
    window._currentProduct.variantId = vid || button.dataset.vid || "";
    window._currentProduct.variantName = button.querySelector(".variant-name-display")?.textContent?.trim() || "";
    window._currentProduct.variantKey = button.dataset.variantkey || "";
    window._currentProduct.image = imageUrl;
    window._currentProduct.price = parseFloat(button.dataset.price) || window._currentProduct.price;
  }
  const quantity = parseInt(document.getElementById("qtyInput")?.value || "1", 10);
  if (vid) updateShippingDisplay(vid, quantity);
  requestAnimationFrame(() => { if (window.syncGalleryHeight) window.syncGalleryHeight(); });
};

function getProductIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("pid") || params.get("id") || null;
}

async function init() {
  applyCurrencyMode();
  await loadExchangeRate();
  const pid = getProductIdFromUrl();
  const container = document.getElementById("productDetail");
  if (!pid) {
    container.innerHTML = `<div class="error-state"><div>No product ID provided.</div><a href="javascript:history.back()">← Go back</a></div>`;
    return;
  }
  try {
    const product = await fetchProductDetails(pid);
    renderProductDetail(product);
  } catch (error) {
    console.error(error);
    container.innerHTML = `<div class="error-state"><div>Could not load product.</div><a href="javascript:history.back()">← Back to shop</a></div>`;
    showToast("Error loading product");
  }
}

/* =========================================================
   CART DRAWER — OPEN/CLOSE + RENDER + CHECKOUT
========================================================= */

const CART_STORAGE_KEY = "premiumCart";
const CART_WHATSAPP_NUMBER = "94767087651"; // ← match index.html

// ---------- Storage ----------

function cartLoad() {
  try {
    const raw = localStorage.getItem(CART_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch { return []; }
}

function cartSave(items) {
  try { localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(items)); } catch {}
}

// ---------- Format helper (safe fallback if useLKR undefined) ----------

function cartFormatPrice(usdPrice) {
  if (typeof formatPrice === "function") return formatPrice(usdPrice || 0);
  return "$" + Number(usdPrice || 0).toFixed(2);
}

// ---------- Render ----------

function renderCartDrawer() {
  const cartItemsEl = document.getElementById("cartItems");
  const cartTotalEl = document.getElementById("cartTotal");
  if (!cartItemsEl || !cartTotalEl) return;

  const items = cartLoad();

  // Badge counts
  const totalQty = items.reduce((s, i) => s + (i.qty || 1), 0);
  document.querySelectorAll(".cart-count").forEach(el => {
    el.textContent = totalQty;
    el.style.display = totalQty > 0 ? "flex" : "none";
  });
  const floatCount = document.getElementById("floatingCartCount");
  if (floatCount) {
    floatCount.textContent = totalQty;
    floatCount.style.display = totalQty > 0 ? "flex" : "none";
  }

  // Empty state
  if (!items.length) {
    cartItemsEl.innerHTML = `
      <div class="cart-empty">
        <i class="fas fa-shopping-cart" style="font-size:40px;"></i>
        <br><br>
        Your cart is empty.
      </div>`;
    cartTotalEl.textContent = cartFormatPrice(0);
    updateCartDetailsSummary();
    validateCartDetails();
    return;
  }

  // Items
  let totalUSD = 0;
  cartItemsEl.innerHTML = items.map((item, idx) => {
    const qty = item.qty || 1;
    const lineTotal = (item.price || 0) * qty;
    totalUSD += lineTotal;
    const vid = (item.variantId || "").replace(/'/g, "\\'");
    const variantLine = item.variantName || item.variantKey
      ? `<div class="cart-item-variant">${escapeHtml(item.variantName || item.variantKey)}</div>`
      : "";
    const img = item.image || "https://via.placeholder.com/100?text=Image";
    return `
      <div class="cart-item">
        <img class="cart-item-image" src="${escapeHtml(img)}" onerror="this.src='https://via.placeholder.com/100?text=Image'">
        <div class="cart-item-info">
          <div class="cart-item-name">${escapeHtml(item.name || "Product")}</div>
          ${variantLine}
          <div class="cart-item-price">${cartFormatPrice(item.price)}</div>
          <div class="cart-item-qty">
            <button class="qty-btn" onclick="cartChangeQty(${idx}, -1)">−</button>
            <span>${qty}</span>
            <button class="qty-btn" onclick="cartChangeQty(${idx}, 1)">+</button>
            <button class="remove-item" onclick="cartRemoveItem(${idx})">Remove</button>
          </div>
        </div>
      </div>`;
  }).join("");

  cartTotalEl.textContent = cartFormatPrice(totalUSD);

  updateCartDetailsSummary();
  validateCartDetails();
}

function escapeHtml(v) {
  return String(v || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// ---------- Mutations ----------

window.cartChangeQty = function(index, delta) {
  const items = cartLoad();
  if (!items[index]) return;
  items[index].qty = Math.max(1, (items[index].qty || 1) + delta);
  cartSave(items);
  renderCartDrawer();
};

window.cartRemoveItem = function(index) {
  const items = cartLoad();
  items.splice(index, 1);
  cartSave(items);
  renderCartDrawer();
};

// ---------- Open / close ----------

function openCartDrawer() {
  document.getElementById("cartDrawer")?.classList.add("open");
  document.getElementById("cartOverlay")?.classList.add("open");
  document.body.style.overflow = "hidden";
  renderCartDrawer();
  // Always collapsed by default
  toggleCartDetails(false);
  updateCartDetailsSummary();
}

function closeCartDrawer() {
  document.getElementById("cartDrawer")?.classList.remove("open");
  document.getElementById("cartOverlay")?.classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("cartButton")?.addEventListener("click", openCartDrawer);
document.getElementById("mobileCartBtn")?.addEventListener("click", openCartDrawer);
document.getElementById("floatingCartBtn")?.addEventListener("click", openCartDrawer);
document.getElementById("closeCart")?.addEventListener("click", closeCartDrawer);
document.getElementById("cartOverlay")?.addEventListener("click", closeCartDrawer);

// ---------- Collapsible details ----------

function toggleCartDetails(forceOpen) {
  const section = document.getElementById("cartDetailsSection");
  if (!section) return;
  const shouldOpen = forceOpen === true ? true
                   : forceOpen === false ? false
                   : !section.classList.contains("open");
  section.classList.toggle("open", shouldOpen);
}

document.getElementById("cartDetailsToggle")?.addEventListener("click", () => toggleCartDetails());

// ---------- Customer details (shared storage with product page) ----------

const CUSTOMER_DETAILS_KEY = "premium_user_details";

function getCartDetails() {
  return {
    name:     document.getElementById("c-name")?.value.trim()     || "",
    country:  document.getElementById("c-country")?.value.trim()  || "",
    city:     document.getElementById("c-city")?.value.trim()     || "",
    addr1:    document.getElementById("c-addr1")?.value.trim()    || "",
    addr2:    document.getElementById("c-addr2")?.value.trim()    || "",
    postal:   document.getElementById("c-postal")?.value.trim()   || "",
    contact:  document.getElementById("c-contact")?.value.trim()  || "",
    contact2: document.getElementById("c-contact2")?.value.trim() || ""
  };
}

function prefillCartDetails() {
  try {
    const saved = JSON.parse(localStorage.getItem(CUSTOMER_DETAILS_KEY) || "{}");
    const map = {
      "c-name": saved.name, "c-country": saved.country, "c-city": saved.city,
      "c-addr1": saved.addr1, "c-addr2": saved.addr2, "c-postal": saved.postal,
      "c-contact": saved.contact, "c-contact2": saved.contact2
    };
    Object.entries(map).forEach(([id, val]) => {
      const el = document.getElementById(id);
      if (el && !el.value && val) el.value = val;
    });
  } catch {}
}

function isCartDetailsValid() {
  const d = getCartDetails();
  return (
    d.name.length >= 2 &&
    d.country.length >= 2 &&
    d.city.length >= 2 &&
    d.addr1.length >= 5 &&
    d.postal.length >= 2 &&
    /^[0-9+\-\s]{7,}$/.test(d.contact)
  );
}

function validateCartDetails() {
  const valid = isCartDetailsValid();
  const btn = document.getElementById("checkout");
  if (btn) btn.disabled = !valid;
  const hint = document.getElementById("cartDetailsHint");
  if (hint) hint.style.display = valid ? "none" : "block";
}

function updateCartDetailsSummary() {
  const el = document.getElementById("cartDetailsSummary");
  if (!el) return;
  const d = getCartDetails();
  const hasAny = d.name || d.city || d.country;
  if (!hasAny) {
    el.textContent = "Tap to enter your details";
    el.classList.remove("filled");
    return;
  }
  const parts = [];
  if (d.name) parts.push(d.name);
  if (d.city) parts.push(d.city);
  if (d.country) parts.push(d.country);
  el.textContent = parts.join(" · ");
  el.classList.add("filled");
}

// Live validation + summary updates
[
  "c-name","c-country","c-city","c-addr1","c-addr2",
  "c-postal","c-contact","c-contact2"
].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener("input", () => {
    validateCartDetails();
    updateCartDetailsSummary();
  });
});

// ---------- Checkout → WhatsApp ----------

function cartCheckoutWhatsApp() {
  const items = cartLoad();
  if (!items.length) { showToast("Your cart is empty"); return; }

  if (!isCartDetailsValid()) {
    showToast("Please fill all required fields (*)");
    toggleCartDetails(true);
    setTimeout(() => {
      const d = getCartDetails();
      if (d.name.length < 2) document.getElementById("c-name")?.focus();
      else if (d.country.length < 2) document.getElementById("c-country")?.focus();
      else if (d.city.length < 2) document.getElementById("c-city")?.focus();
      else if (d.addr1.length < 5) document.getElementById("c-addr1")?.focus();
      else if (d.postal.length < 2) document.getElementById("c-postal")?.focus();
      else if (!/^[0-9+\-\s]{7,}$/.test(d.contact)) document.getElementById("c-contact")?.focus();
    }, 300);
    return;
  }

  const d = getCartDetails();
  // Save for reuse on product page
  localStorage.setItem(CUSTOMER_DETAILS_KEY, JSON.stringify(d));

  let totalUSD = 0;
  let itemLines = "";
  items.forEach((item, i) => {
    const qty = item.qty || 1;
    const lineTotal = (item.price || 0) * qty;
    totalUSD += lineTotal;
    itemLines += `${i + 1}. *${item.name}*\n`;
    itemLines += `   Qty: ${qty} × ${cartFormatPrice(item.price)} = ${cartFormatPrice(lineTotal)}\n`;
    if (item.variantName || item.variantKey)
      itemLines += `   Variant: ${item.variantName || item.variantKey}\n`;
    if (item.shipping?.logisticName)
      itemLines += `   Shipping: ${item.shipping.logisticName}\n`;
    if (item.id) itemLines += `   PID: ${item.id}\n`;
    itemLines += `\n`;
  });

  let addressLine = d.addr1;
  if (d.addr2) addressLine += `, ${d.addr2}`;
  if (d.city) addressLine += `, ${d.city}`;
  if (d.country) addressLine += `, ${d.country}`;
  if (d.postal) addressLine += ` (${d.postal})`;

  let msg = `*🛒 NEW ORDER*\n\n`;
  msg += `*Customer Details*\n`;
  msg += `Name: ${d.name}\n`;
  msg += `Country: ${d.country}\n`;
  msg += `City: ${d.city}\n`;
  msg += `Address: ${addressLine}\n`;
  msg += `Postal Code: ${d.postal}\n`;
  msg += `Contact: ${d.contact}\n`;
  if (d.contact2) msg += `Secondary Contact: ${d.contact2}\n`;
  msg += `\n*Order Items*\n`;
  msg += `----------------------------\n`;
  msg += itemLines;
  msg += `----------------------------\n`;
  msg += `*Total: ${cartFormatPrice(totalUSD)}*\n\n`;
  msg += `Thank you! 🙏`;

  window.open(`https://wa.me/${CART_WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
}

document.getElementById("checkout")?.addEventListener("click", cartCheckoutWhatsApp);

// ---------- Init ----------

document.addEventListener("DOMContentLoaded", () => {
  prefillCartDetails();
  renderCartDrawer();
});

// Re-sync when coming back to this tab from another tab
window.addEventListener("storage", (e) => {
  if (e.key === CART_STORAGE_KEY) renderCartDrawer();
});

init();
</script>
</body>
